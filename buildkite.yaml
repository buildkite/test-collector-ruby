agents:
  queue: hosted

steps:
  - label: ":rspec: Tests :ruby: {{matrix}}"
    command:
      - "gem install bundler:2.3.25"
      - "gem build buildkite-test_collector.gemspec"
      - "gem install ./buildkite-test_collector-*.gem"
      - "bundle"
      - "bundle exec rake"
      - "bundle exec cucumber"
    plugins:
      - aws-assume-role-with-web-identity#v1.2.0:
          role-arn: "${OIDC_ASSUME_ROLE_ARN:-arn:aws:iam::445615400570:role/pipeline-buildkite-test-collector-ruby-build}"
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch

      - ecr#v2.9.0:
          login: true
          account_ids: "public.ecr.aws"
          region: "us-east-1"
      - docker#v3.7.0:
          image: "public.ecr.aws/docker/library/ruby:{{matrix}}"
    matrix:
      - "latest"
      - "3.4"
      - "3.3"

  - label: ":ruby: Reject unsupported Ruby"
    command:
      - "gem build buildkite-test_collector.gemspec"
      - >-
        ruby -rrubygems/package -e '
          spec = Gem::Package.new(Dir["buildkite-test_collector-*.gem"].fetch(0)).spec;
          abort unless spec.required_ruby_version == Gem::Requirement.new(">= 3.3.0")
        '
      - "! gem install ./buildkite-test_collector-*.gem"
    plugins:
      - aws-assume-role-with-web-identity#v1.2.0:
          role-arn: "${OIDC_ASSUME_ROLE_ARN:-arn:aws:iam::445615400570:role/pipeline-buildkite-test-collector-ruby-build}"
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch

      - ecr#v2.9.0:
          login: true
          account_ids: "public.ecr.aws"
          region: "us-east-1"
      - docker#v3.7.0:
          image: "public.ecr.aws/docker/library/ruby:3.2"
